<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In – SpoofStream</title>
  <style>
    :root {
      --bg: #0f0f0f;
      --bg-secondary: #212121;
      --bg-hover: #3f3f3f;
      --text: #f1f1f1;
      --text-secondary: #aaaaaa;
      --accent: #3ea6ff;
      --red: #ff4e45;
      --border: #303030;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.5px;
      text-decoration: none;
      color: var(--text);
    }

    .logo span {
      color: var(--accent);
    }

    .back-link {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .back-link:hover {
      color: var(--text);
    }

    .auth-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .auth-card {
      width: 100%;
      max-width: 420px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 36px 32px;
    }

    .auth-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .auth-header h1 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .auth-header p {
      color: var(--text-secondary);
      font-size: 14px;
    }

    .tabs {
      display: flex;
      background: var(--bg);
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 28px;
    }

    .tab {
      flex: 1;
      text-align: center;
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      color: var(--text-secondary);
      transition: all 0.15s;
    }

    .tab.active {
      background: var(--bg-hover);
      color: var(--text);
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 6px;
      color: var(--text-secondary);
    }

    .form-group input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      color: var(--text);
      font-size: 15px;
      outline: none;
      transition: border-color 0.15s;
    }

    .form-group input:focus {
      border-color: var(--accent);
    }

    .form-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
      font-size: 13px;
    }

    .checkbox {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-secondary);
      cursor: pointer;
    }

    .checkbox input {
      accent-color: var(--accent);
    }

    .forgot {
      color: var(--accent);
      text-decoration: none;
    }

    .forgot:hover {
      text-decoration: underline;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: background 0.15s;
    }

    .btn-primary {
      background: var(--accent);
      color: #000;
      margin-bottom: 16px;
    }

    .btn-primary:hover {
      background: #65b8ff;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
      color: var(--text-secondary);
      font-size: 13px;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn-outline:hover {
      background: var(--bg-hover);
    }

    .switch-text {
      text-align: center;
      margin-top: 24px;
      font-size: 14px;
      color: var(--text-secondary);
    }

    .switch-text a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }

    .switch-text a:hover {
      text-decoration: underline;
    }

    .profile-view {
      display: none;
      text-align: center;
    }

    .profile-view.active {
      display: block;
    }

    .avatar-large {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--bg-hover);
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 600;
      color: var(--accent);
    }

    .profile-view h2 {
      font-size: 20px;
      margin-bottom: 4px;
    }

    .profile-view p {
      color: var(--text-secondary);
      font-size: 14px;
      margin-bottom: 24px;
    }

    .profile-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-secondary {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
    }

    .btn-secondary:hover {
      background: var(--bg-hover);
    }

    .btn-danger {
      background: transparent;
      border: 1px solid var(--red);
      color: var(--red);
    }

    .btn-danger:hover {
      background: rgba(255, 78, 69, 0.1);
    }

    .form-view {
      display: none;
    }

    .form-view.active {
      display: block;
    }

    @media (max-width: 480px) {
      .auth-card {
        padding: 28px 20px;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a href="index.html" class="logo">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
        <path d="M4 6h16v12H4z" fill="#3ea6ff"/>
        <path d="M10 9l5 3-5 3V9z" fill="#0f0f0f"/>
      </svg>
      Spoof<span>Stream</span>
    </a>
    <a href="index.html" class="back-link">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      Back to Home
    </a>
  </header>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div id="authForms">
        <div class="auth-header">
          <h1 id="authTitle">Welcome back</h1>
          <p id="authSubtitle">Sign in to continue to SpoofStream</p>
        </div>

        <div class="tabs">
          <div class="tab active" data-tab="signin">Sign In</div>
          <div class="tab" data-tab="signup">Sign Up</div>
        </div>

        <!-- Sign In -->
        <div class="form-view active" id="signinForm">
          <div class="form-group">
            <label for="signin-email">Email</label>
            <input type="email" id="signin-email" placeholder="you@example.com" />
          </div>
          <div class="form-group">
            <label for="signin-password">Password</label>
            <input type="password" id="signin-password" placeholder="••••••••" />
          </div>
          <div class="form-row">
            <label class="checkbox">
              <input type="checkbox" /> Remember me
            </label>
            <a href="#" class="forgot">Forgot password?</a>
          </div>
          <button class="btn btn-primary" id="signinBtn">Sign In</button>
        </div>

        <!-- Sign Up -->
        <div class="form-view" id="signupForm">
          <div class="form-group">
            <label for="signup-name">Display name</label>
            <input type="text" id="signup-name" placeholder="Your name or channel name" />
          </div>
          <div class="form-group">
            <label for="signup-email">Email</label>
            <input type="email" id="signup-email" placeholder="you@example.com" />
          </div>
          <div class="form-group">
            <label for="signup-password">Password</label>
            <input type="password" id="signup-password" placeholder="Create a password" />
          </div>
          <div class="form-group">
            <label for="signup-confirm">Confirm password</label>
            <input type="password" id="signup-confirm" placeholder="Confirm password" />
          </div>
          <button class="btn btn-primary" id="signupBtn">Create Account</button>
        </div>

        <div class="divider">or</div>

        <button class="btn btn-outline">
          <svg width="18" height="18" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          Continue with Google
        </button>

        <p class="switch-text" id="switchText">
          Don’t have an account? <a href="#" id="switchLink">Sign up</a>
        </p>
      </div>

      <!-- Simple profile view after demo login -->
      <div class="profile-view" id="profileView">
        <div class="avatar-large" id="profileAvatar">U</div>
        <h2 id="profileName">User</h2>
        <p id="profileEmail">user@example.com</p>

        <div class="profile-actions">
          <button class="btn btn-primary" onclick="window.location.href='index.html'">Go to Homepage</button>
          <button class="btn btn-secondary">Edit Profile</button>
          <button class="btn btn-secondary">Your Channel</button>
          <button class="btn btn-danger" id="signOutBtn">Sign Out</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const tabs = document.querySelectorAll('.tab');
    const signinForm = document.getElementById('signinForm');
    const signupForm = document.getElementById('signupForm');
    const authTitle = document.getElementById('authTitle');
    const authSubtitle = document.getElementById('authSubtitle');
    const switchText = document.getElementById('switchText');
    const authForms = document.getElementById('authForms');
    const profileView = document.getElementById('profileView');

    function bindSwitchLink() {
      const link = document.getElementById('switchLink');
      if (!link) return;
      link.onclick = (e) => {
        e.preventDefault();
        const isSignIn = signinForm.classList.contains('active');
        tabs[isSignIn ? 1 : 0].click();
      };
    }

    function showSignIn() {
      signinForm.classList.add('active');
      signupForm.classList.remove('active');
      authTitle.textContent = 'Welcome back';
      authSubtitle.textContent = 'Sign in to continue to SpoofStream';
      switchText.innerHTML = 'Don’t have an account? <a href="#" id="switchLink">Sign up</a>';
      bindSwitchLink();
    }

    function showSignUp() {
      signupForm.classList.add('active');
      signinForm.classList.remove('active');
      authTitle.textContent = 'Create account';
      authSubtitle.textContent = 'Join SpoofStream and start uploading';
      switchText.innerHTML = 'Already have an account? <a href="#" id="switchLink">Sign in</a>';
      bindSwitchLink();
    }

    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        tabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        if (tab.dataset.tab === 'signin') showSignIn();
        else showSignUp();
      });
    });

    bindSwitchLink();

    // Demo only – no real backend
    document.getElementById('signinBtn').addEventListener('click', () => {
      const email = document.getElementById('signin-email').value || 'user@example.com';
      const name = email.split('@')[0];
      showProfile(name, email);
    });

    document.getElementById('signupBtn').addEventListener('click', () => {
      const name = document.getElementById('signup-name').value || 'New Creator';
      const email = document.getElementById('signup-email').value || 'new@example.com';
      showProfile(name, email);
    });

    function showProfile(name, email) {
      authForms.style.display = 'none';
      profileView.classList.add('active');
      document.getElementById('profileName').textContent = name;
      document.getElementById('profileEmail').textContent = email;
      document.getElementById('profileAvatar').textContent = name.charAt(0).toUpperCase();
    }

    document.getElementById('signOutBtn').addEventListener('click', () => {
      profileView.classList.remove('active');
      authForms.style.display = 'block';
      document.getElementById('signin-email').value = '';
      document.getElementById('signin-password').value = '';
    });
  </script>
</body>
</html>
