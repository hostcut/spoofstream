<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Watch – SpoofStream</title>
  <style>
    :root {
      --bg: #0f0f0f;
      --text: #f1f1f1;
      --muted: #aaaaaa;
      --accent: #3ea6ff;
      --border: #303030;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
      max-width: 960px;
      margin: 0 auto;
    }
    a { color: var(--accent); text-decoration: none; }
    .back { display: inline-block; margin-bottom: 16px; font-size: 14px; }
    .player-wrap {
      position: relative;
      width: 100%;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
    }
    video { width: 100%; max-height: 70vh; display: block; background: #000; }
    h1 { font-size: 20px; margin: 16px 0 8px; }
    p { color: var(--muted); font-size: 14px; line-height: 1.5; }
    .err { color: #ff4e45; margin-top: 12px; }
    .debug {
      margin-top: 16px; padding: 12px;
      background: #212121; border-radius: 8px;
      font-size: 12px; color: var(--muted);
      word-break: break-all;
    }
  </style>
</head>
<body>
  <a class="back" href="/">← Home</a>
  <div id="app">
    <p>Loading…</p>
  </div>

  <script>
    const id = new URLSearchParams(location.search).get("v");
    const app = document.getElementById("app");

    function titleFromId(id) {
      return (id || "")
        .replace(/[-_]+/g, " ")
        .replace(/\b\w/g, (c) => c.toUpperCase());
    }

    async function main() {
      if (!id) {
        app.innerHTML = '<p class="err">Missing video id. Open a video from Home.</p>';
        return;
      }

      // Prefer API metadata; always fall back to known R2 path
      let title = titleFromId(id);
      let src = "/media/videos/" + encodeURIComponent(id) + ".mp4";

      try {
        const res = await fetch("/api/videos");
        if (res.ok) {
          const data = await res.json();
          const hit = (data.videos || []).find((v) => v.id === id);
          if (hit) {
            title = hit.title || title;
            src = hit.url || src;
          }
        }
      } catch {
        /* use fallback src */
      }

      document.title = title + " – SpoofStream";
      app.innerHTML = `
        <div class="player-wrap">
          <video id="vid" controls playsinline preload="metadata" src="${src}"></video>
        </div>
        <h1>${title}</h1>
        <p>AI parody · served from R2</p>
        <div class="debug">
          Video src: <a href="${src}" target="_blank" rel="noopener">${src}</a>
          <div id="vidStatus"></div>
        </div>
      `;

      const vid = document.getElementById("vid");
      const vidStatus = document.getElementById("vidStatus");
      vid.addEventListener("error", () => {
        vidStatus.textContent =
          "Playback error. Open the src link above — if that 404s, the media Function or R2 key is wrong.";
      });
      vid.addEventListener("loadeddata", () => {
        vidStatus.textContent = "Loaded OK.";
      });
    }

    main();
  </script>
</body>
</html>
