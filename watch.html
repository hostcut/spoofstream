<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Watch – SpoofStream</title>
  <style>
    :root {
      --bg: #0f0f0f;
      --text: #f1f1f11;
      --text-secondary: #aaaaaa;
      --accent: #3ea6ff;
      --border: #303030;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
      max-width: 960px;
      margin: 0 auto;
    }
    a { color: var(--accent); }
    .back { display: inline-block; margin-bottom: 16px; font-size: 14px; }
    video {
      width: 100%;
      max-height: 70vh;
      background: #000;
      border-radius: 12px;
    }
    h1 { font-size: 20px; margin: 16px 0 8px; }
    p { color: var(--text-secondary); font-size: 14px; }
    .err { color: #ff4e45; margin-top: 24px; }
  </style>
</head>
<body>
  <a class="back" href="index.html">← Home</a>
  <div id="player"></div>

  <script>
    const id = new URLSearchParams(location.search).get("v");

    async function load() {
      const root = document.getElementById("player");
      if (!id) {
        root.innerHTML = '<p class="err">Missing video id.</p>';
        return;
      }

      const res = await fetch("/api/videos");
      const data = await res.json();
      const video = (data.videos || []).find((v) => v.id === id);

      if (!video) {
        root.innerHTML = '<p class="err">Video not found in R2.</p>';
        return;
      }

      document.title = video.title + " – SpoofStream";
      root.innerHTML = `
        <video controls autoplay playsinline src="${video.url}"></video>
        <h1>${video.title}</h1>
        <p>AI-generated or user-uploaded parody · served from R2</p>
      `;
    }

    load();
  </script>
</body>
</html>
