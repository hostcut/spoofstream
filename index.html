<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SpoofStream</title>
  <style>
    :root {
      --bg: #0f0f0f;
      --bg-secondary: #212121;
      --bg-hover: #3f3f3f;
      --text: #f1f1f1;
      --text-secondary: #aaaaaa;
      --accent: #3ea6ff;
      --border: #303030;
      --sidebar-width: 220px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      min-height: 100vh;
    }
    a { color: inherit; text-decoration: none; }
    .sidebar {
      width: var(--sidebar-width);
      border-right: 1px solid var(--border);
      padding: 16px 12px;
      position: fixed;
      inset: 0 auto 0 0;
    }
    .logo { font-size: 20px; font-weight: 700; padding: 8px 12px 20px; }
    .logo span { color: var(--accent); }
    .nav-item {
      display: block;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 2px;
    }
    .nav-item:hover, .nav-item.active { background: var(--bg-hover); }
    .main { margin-left: var(--sidebar-width); flex: 1; }
    .topbar {
      position: sticky; top: 0;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }
    .content { padding: 24px; }
    h2 { font-size: 18px; margin-bottom: 16px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px 16px;
    }
    .card { display: block; }
    .card:hover { transform: translateY(-2px); transition: transform 0.15s; }
    .thumb {
      position: relative;
      aspect-ratio: 16/9;
      background: var(--bg-secondary);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 10px;
    }
    .thumb img, .thumb video {
      width: 100%; height: 100%; object-fit: cover;
    }
    .badge {
      position: absolute; top: 8px; left: 8px;
      background: rgba(0,0,0,0.75); color: var(--accent);
      font-size: 11px; font-weight: 600; padding: 3px 7px; border-radius: 4px;
    }
    .meta h3 { font-size: 14px; font-weight: 500; margin-bottom: 4px; }
    .meta p { font-size: 13px; color: var(--text-secondary); }
    .empty {
      color: var(--text-secondary);
      padding: 48px 0;
      font-size: 15px;
      line-height: 1.5;
    }
    .btn {
      padding: 8px 16px; border-radius: 20px; font-size: 14px; font-weight: 500;
      border: 1px solid var(--border); color: var(--accent); background: transparent;
    }
    @media (max-width: 900px) {
      .grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 600px) {
      .sidebar { display: none; }
      .main { margin-left: 0; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="logo">Spoof<span>Stream</span></div>
    <a class="nav-item active" href="index.html">Home</a>
    <a class="nav-item" href="upload.html">Upload</a>
  </aside>

  <div class="main">
    <header class="topbar">
      <strong>Library</strong>
      <a class="btn" href="upload.html">Upload</a>
    </header>
    <div class="content">
      <h2>Videos</h2>
      <div id="status" class="empty">Loading…</div>
      <div class="grid" id="grid" hidden></div>
    </div>
  </div>

  <script>
    function formatDate(iso) {
      if (!iso) return "";
      try {
        return new Date(iso).toLocaleDateString(undefined, {
          year: "numeric", month: "short", day: "numeric"
        });
      } catch {
        return "";
      }
    }

    async function load() {
      const status = document.getElementById("status");
      const grid = document.getElementById("grid");

      try {
        const res = await fetch("/api/videos");
        if (!res.ok) throw new Error("Failed to load videos");
        const data = await res.json();
        const videos = data.videos || [];

        if (videos.length === 0) {
          status.innerHTML = "No videos yet. Upload an MP4 to the R2 bucket under <code>videos/</code>, then refresh.";
          return;
        }

        status.hidden = true;
        grid.hidden = false;
        grid.innerHTML = videos.map((v) => `
          <a class="card" href="watch.html?v=${encodeURIComponent(v.id)}">
            <div class="thumb">
              <img src="${v.thumb}" alt="" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" />
              <video src="${v.url}#t=0.1" muted preload="metadata" style="display:none"></video>
              <div class="badge">AI PARODY</div>
            </div>
            <div class="meta">
              <h3>${v.title}</h3>
              <p>${formatDate(v.uploaded)}</p>
            </div>
          </a>
        `).join("");
      } catch (err) {
        status.textContent = "Could not load videos. Check that /api/videos works and MEDIA is bound.";
      }
    }

    load();
  </script>
</body>
</html>
