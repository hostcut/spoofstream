<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SpoofStream – AI Parodies</title>
  <meta name="description" content="AI parody videos, clearly labeled." />
  <style>
    :root {
      --bg: #0f0f0f;
      --bg-secondary: #212121;
      --bg-hover: #3f3f3f;
      --text: #f1f1f1;
      --text-secondary: #aaaaaa;
      --accent: #3ea6ff;
      --border: #303030;
      --sidebar-width: 240px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      min-height: 100vh;
    }
    a { color: inherit; text-decoration: none; }
    .sidebar {
      width: var(--sidebar-width);
      border-right: 1px solid var(--border);
      height: 100vh;
      position: fixed;
      left: 0; top: 0;
      padding: 12px;
      overflow-y: auto;
      z-index: 100;
    }
    .logo {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 12px 20px;
      font-size: 20px; font-weight: 700;
    }
    .logo span { color: var(--accent); }
    .nav-item {
      display: flex; align-items: center; gap: 16px;
      padding: 10px 12px; border-radius: 10px;
      font-size: 14px; font-weight: 500; margin-bottom: 2px;
    }
    .nav-item:hover, .nav-item.active { background: var(--bg-hover); }
    .section-title {
      font-size: 12px; font-weight: 600; color: var(--text-secondary);
      padding: 16px 12px 8px; text-transform: uppercase; letter-spacing: 0.4px;
    }
    .main { margin-left: var(--sidebar-width); flex: 1; min-height: 100vh; }
    .topbar {
      position: sticky; top: 0; z-index: 50;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 10px 24px;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
    }
    .search-container { flex: 1; max-width: 640px; display: flex; }
    .search-input {
      flex: 1; background: var(--bg); border: 1px solid var(--border);
      border-right: none; border-radius: 40px 0 0 40px;
      padding: 10px 18px; color: var(--text); font-size: 16px; outline: none;
    }
    .search-input:focus { border-color: var(--accent); }
    .search-btn {
      background: var(--bg-secondary); border: 1px solid var(--border);
      border-radius: 0 40px 40px 0; padding: 0 20px; color: var(--text); cursor: pointer;
    }
    .btn {
      padding: 8px 16px; border-radius: 20px; font-size: 14px; font-weight: 500;
      border: 1px solid var(--border); color: var(--accent); background: transparent;
    }
    .btn:hover { background: rgba(62, 166, 255, 0.1); }
    .content { padding: 24px; }
    .section-header { margin-bottom: 18px; }
    .section-header h2 { font-size: 18px; font-weight: 600; }
    .video-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px 16px;
    }
    .video-card { display: block; transition: transform 0.15s; }
    .video-card:hover { transform: translateY(-2px); }
    .thumbnail {
      position: relative; aspect-ratio: 16/9;
      background: var(--bg-secondary); border-radius: 12px;
      overflow: hidden; margin-bottom: 10px;
    }
    .thumbnail img, .thumbnail video {
      width: 100%; height: 100%; object-fit: cover;
    }
    .ai-badge {
      position: absolute; top: 8px; left: 8px;
      background: rgba(0,0,0,0.75); color: var(--accent);
      font-size: 11px; font-weight: 600; padding: 3px 7px; border-radius: 4px;
    }
    .video-meta h3 {
      font-size: 14px; font-weight: 500; line-height: 1.4; margin-bottom: 4px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .video-meta p { font-size: 13px; color: var(--text-secondary); }
    .empty {
      color: var(--text-secondary); font-size: 15px; line-height: 1.6;
      padding: 32px 0; max-width: 520px;
    }
    .empty code {
      background: var(--bg-secondary); padding: 2px 6px; border-radius: 4px; font-size: 13px;
    }
    @media (max-width: 1100px) {
      .video-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 700px) {
      .sidebar { display: none; }
      .main { margin-left: 0; }
      .video-grid { grid-template-columns: 1fr; }
      .content { padding: 16px; }
    }
  </style>
</head>
<body>
  <aside class="sidebar">
    <a href="index.html" class="logo">Spoof<span>Stream</span></a>
    <a href="index.html" class="nav-item active">Home</a>
    <a href="upload.html" class="nav-item">Upload</a>
    <div class="section-title">Library</div>
    <a href="upload.html" class="nav-item">Your Uploads</a>
  </aside>

  <div class="main">
    <header class="topbar">
      <form class="search-container" action="index.html" method="get">
        <input class="search-input" type="search" name="q" placeholder="Search your library..." />
        <button class="search-btn" type="submit">Search</button>
      </form>
      <a class="btn" href="upload.html">Upload</a>
    </header>

    <div class="content">
      <div class="section-header">
        <h2>Videos</h2>
      </div>
      <div id="status" class="empty">Loading…</div>
      <div id="grid" class="video-grid" hidden></div>
    </div>
  </div>

  <script>
    function titleFromId(id) {
      return id.replace(/[-_]+/g, " ").replace(/\b\w/g, (c) => c.toUpperCase());
    }

    function formatDate(iso) {
      if (!iso) return "";
      return new Date(iso).toLocaleDateString(undefined, {
        year: "numeric", month: "short", day: "numeric"
      });
    }

    async function load() {
      const status = document.getElementById("status");
      const grid = document.getElementById("grid");
      const q = (new URLSearchParams(location.search).get("q") || "").trim().toLowerCase();

      try {
        const res = await fetch("/api/videos");
        if (!res.ok) throw new Error("bad response");
        let videos = (await res.json()).videos || [];

        if (q) {
          videos = videos.filter((v) =>
            (v.title || v.id).toLowerCase().includes(q)
          );
        }

        if (!videos.length) {
          status.innerHTML = q
            ? `No videos match <strong>${q.replace(/</g, "")}</strong>.`
            : `No videos yet.<br><br>
               In Cloudflare R2 → <code>spoofstream-videos</code>, upload an MP4 with key
               <code>videos/your-name.mp4</code>, then refresh this page.<br><br>
               Optional thumbnail: <code>thumbs/your-name.jpg</code>`;
          return;
        }

        status.hidden = true;
        grid.hidden = false;
        grid.innerHTML = videos.map((v) => {
          const title = v.title || titleFromId(v.id);
          return `
            <a class="video-card" href="watch.html?v=${encodeURIComponent(v.id)}">
              <div class="thumbnail">
                <img src="${v.thumb}" alt=""
                  onerror="this.remove(); this.parentElement.querySelector('video').style.display='block';" />
                <video src="${v.url}#t=0.1" muted preload="metadata" style="display:none"></video>
                <div class="ai-badge">AI PARODY</div>
              </div>
              <div class="video-meta">
                <h3>${title}</h3>
                <p>${formatDate(v.uploaded)} · from your library</p>
              </div>
            </a>`;
        }).join("");
      } catch {
        status.textContent = "Could not load /api/videos. Check the Function deploy and MEDIA binding.";
      }
    }

    load();
  </script>
</body>
</html>
