<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Search – SpoofStream</title>
  <style>
    :root {
      --bg: #0f0f0f;
      --bg-secondary: #212121;
      --bg-hover: #3f3f3f;
      --text: #f1f1f1;
      --text-secondary: #aaaaaa;
      --accent: #3ea6ff;
      --red: #ff4e45;
      --border: #303030;
      --sidebar-width: 240px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      min-height: 100vh;
    }
    a { color: inherit; text-decoration: none; }
    .sidebar {
      width: var(--sidebar-width);
      background: var(--bg);
      border-right: 1px solid var(--border);
      height: 100vh;
      position: fixed;
      left: 0; top: 0;
      padding: 12px;
      overflow-y: auto;
      z-index: 100;
      transition: transform 0.25s ease;
    }
    .logo {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 12px 20px;
      font-size: 20px; font-weight: 700; letter-spacing: -0.5px;
    }
    .logo span { color: var(--accent); }
    .nav-item {
      display: flex; align-items: center; gap: 20px;
      padding: 10px 12px; border-radius: 10px;
      font-size: 14px; font-weight: 500;
      transition: background 0.15s; margin-bottom: 2px; cursor: pointer;
    }
    .nav-item:hover, .nav-item.active { background: var(--bg-hover); }
    .nav-item svg { width: 22px; height: 22px; flex-shrink: 0; }
    .section-title {
      font-size: 13px; font-weight: 600; color: var(--text-secondary);
      padding: 16px 12px 8px; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .main { margin-left: var(--sidebar-width); flex: 1; min-height: 100vh; }
    .topbar {
      position: sticky; top: 0; background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 10px 24px;
      display: flex; align-items: center; justify-content: space-between; gap: 20px;
      z-index: 50;
    }
    .menu-btn {
      display: none; background: none; border: none; color: var(--text);
      cursor: pointer; padding: 8px; border-radius: 50%;
    }
    .menu-btn:hover { background: var(--bg-hover); }
    .search-container { flex: 1; max-width: 640px; display: flex; }
    .search-input {
      flex: 1; background: var(--bg); border: 1px solid var(--border);
      border-right: none; border-radius: 40px 0 0 40px;
      padding: 10px 18px; color: var(--text); font-size: 16px; outline: none;
    }
    .search-input:focus { border-color: var(--accent); }
    .search-btn {
      background: var(--bg-secondary); border: 1px solid var(--border);
      border-radius: 0 40px 40px 0; padding: 0 22px; cursor: pointer; color: var(--text);
    }
    .btn {
      padding: 8px 16px; border-radius: 20px; font-size: 14px; font-weight: 500;
      cursor: pointer; border: none; display: inline-flex; align-items: center;
    }
    .btn-outline {
      background: transparent; border: 1px solid var(--border); color: var(--accent);
    }
    .btn-outline:hover { background: rgba(62, 166, 255, 0.1); }

    .content { padding: 24px; max-width: 900px; }
    .results-header {
      font-size: 14px; color: var(--text-secondary);
      margin-bottom: 20px;
    }
    .results-header strong { color: var(--text); }

    .result-item {
      display: flex;
      gap: 16px;
      margin-bottom: 20px;
      cursor: pointer;
    }
    .result-item:hover .result-title { color: var(--accent); }
    .result-thumb {
      position: relative;
      width: 320px;
      flex-shrink: 0;
      aspect-ratio: 16/9;
      background: var(--bg-secondary);
      border-radius: 12px;
      overflow: hidden;
    }
    .result-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .result-thumb .duration {
      position: absolute; bottom: 8px; right: 8px;
      background: rgba(0,0,0,0.85); color: white;
      font-size: 12px; font-weight: 500; padding: 2px 6px; border-radius: 4px;
    }
    .result-thumb .ai-badge {
      position: absolute; top: 8px; left: 8px;
      background: rgba(0,0,0,0.75); color: var(--accent);
      font-size: 11px; font-weight: 600; padding: 3px 7px; border-radius: 4px;
    }
    .result-info { flex: 1; min-width: 0; }
    .result-title {
      font-size: 16px; font-weight: 500; line-height: 1.35;
      margin-bottom: 6px; transition: color 0.15s;
    }
    .result-meta {
      font-size: 13px; color: var(--text-secondary);
      margin-bottom: 8px;
    }
    .result-channel {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 8px; font-size: 13px; color: var(--text-secondary);
    }
    .result-channel .av {
      width: 24px; height: 24px; border-radius: 50%;
      background: var(--bg-hover);
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 600; color: var(--accent);
    }
    .result-desc {
      font-size: 13px; color: var(--text-secondary);
      line-height: 1.4;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .no-results {
      color: var(--text-secondary); font-size: 15px; padding: 40px 0;
    }

    .overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.5); z-index: 90;
    }
    .overlay.show { display: block; }

    @media (max-width: 768px) {
      .sidebar { transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
      .main { margin-left: 0; }
      .menu-btn { display: block; }
      .result-item { flex-direction: column; }
      .result-thumb { width: 100%; }
      .content { padding: 16px; }
    }
  </style>
</head>
<body>
  <div class="overlay" id="overlay"></div>

  <aside class="sidebar" id="sidebar">
    <a href="index.html" class="logo">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
        <path d="M4 6h16v12H4z" fill="#3ea6ff"/>
        <path d="M10 9l5 3-5 3V9z" fill="#0f0f0f"/>
      </svg>
      Spoof<span>Stream</span>
    </a>
    <a href="index.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      Home
    </a>
    <div class="nav-item">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.77 10.32l-1.2-.5L18 9.06c1.84-.96 2.53-3.23 1.56-5.06s-3.24-2.53-5.07-1.56L6 6.94c-1.29.68-2.26 1.99-2.6 3.44-.32 1.46.06 2.96 1.04 4.11l1.2.5-1.44.75c-1.84.96-2.53 3.23-1.56 5.06s3.24 2.53 5.07 1.56l8.5-4.42c1.29-.68 2.26-1.99 2.6-3.44.32-1.46-.06-2.96-1.04-4.11z"/></svg>
      Shorts
    </div>
    <div class="nav-item">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 18v-6l5 3-5 3zm7-15H7v2h10V3zm2 4H5v12h14V7zm-7 2v6l5-3-5-3z"/></svg>
      Subscriptions
    </div>
    <div class="section-title">Library</div>
    <a href="upload.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-1 9h-4v4h-2v-4H9V9h4V5h2v4h4v2z"/></svg>
      Your Uploads
    </a>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
      </button>
      <form class="search-container" action="search.html" method="get">
        <input type="text" name="q" id="searchField" class="search-input" placeholder="Search AI parodies..." />
        <button type="submit" class="search-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        </button>
      </form>
      <div class="top-actions">
        <a href="auth.html" class="btn btn-outline">Sign In</a>
      </div>
    </header>

    <div class="content">
      <div class="results-header" id="resultsHeader">Search results</div>
      <div id="resultsList"></div>
    </div>
  </div>

  <script>
    const catalog = [
      { id: 'office1', title: 'Dunder Mifflin Preps for the Blue Tsunami', channel: 'TBC_on_X', avatar: 'T', channelId: 'tbc', views: '1.9M views', age: '2 hours ago', duration: '15:47', thumb: 'https://picsum.photos/seed/office1/640/360', desc: 'Office crisis mode for the Blue Tsunami. AI parody.' },
      { id: 'office2', title: 'Michael Scott Explains Large Language Models', channel: 'AI Office Labs', avatar: 'A', channelId: 'aioffice', views: '482K views', age: '5 hours ago', duration: '8:22', thumb: 'https://picsum.photos/seed/office2/640/360', desc: 'Transformers, tokens, and printers that hate you.' },
      { id: 'friends1', title: 'Friends but Everyone is Running for Office', channel: 'SpoofCentral', avatar: 'F', channelId: 'spoofcentral', views: '310K views', age: '1 day ago', duration: '12:05', thumb: 'https://picsum.photos/seed/friends1/640/360', desc: 'The whole gang hits the campaign trail.' },
      { id: 'breaking', title: 'Breaking Bad – The AI Startup Arc', channel: 'RemakeFactory', avatar: 'B', channelId: 'remake', views: '890K views', age: '2 days ago', duration: '22:18', thumb: 'https://picsum.photos/seed/breaking/640/360', desc: 'Walter pivots to foundation models.' },
      { id: 'seinfeld', title: 'Seinfeld: The Algorithm Episode', channel: 'ClassicSpoofs', avatar: 'S', channelId: 'classic', views: '215K views', age: '3 days ago', duration: '9:41', thumb: 'https://picsum.photos/seed/seinfeld/640/360', desc: 'Jerry vs the recommendation engine.' },
      { id: 'office3', title: 'Dwight’s Guide to Surviving the Blue Wave', channel: 'SchruteFarmsAI', avatar: 'D', channelId: 'schrute', views: '1.1M views', age: '4 days ago', duration: '18:03', thumb: 'https://picsum.photos/seed/office3/640/360', desc: 'Beets, batteries, contingency plans.' },
      { id: 'parks', title: 'Parks and Rec: The Government Shutdown Special', channel: 'LeslieAI', avatar: 'P', channelId: 'leslie', views: '167K views', age: '6 hours ago', duration: '11:27', thumb: 'https://picsum.photos/seed/parks/640/360', desc: 'Leslie will not cancel the harvest festival.' },
      { id: 'simpsons', title: 'The Simpsons Predict the Next Election', channel: 'SpringfieldSpoofs', avatar: 'H', channelId: 'springfield', views: '542K views', age: '1 day ago', duration: '7:55', thumb: 'https://picsum.photos/seed/simpsons/640/360', desc: 'Another eerily accurate prediction.' },
      { id: 'office4', title: 'Jim’s Camera Looks – AI Election Edition', channel: 'BeeslyBots', avatar: 'J', channelId: 'beesly', views: '298K views', age: '2 days ago', duration: '14:12', thumb: 'https://picsum.photos/seed/office4/640/360', desc: 'Jim looks at the camera. Politics ensues.' }
    ];

    const params = new URLSearchParams(window.location.search);
    const q = (params.get('q') || '').trim();
    document.getElementById('searchField').value = q;

    const qLower = q.toLowerCase();
    const hits = q
      ? catalog.filter(v =>
          v.title.toLowerCase().includes(qLower) ||
          v.channel.toLowerCase().includes(qLower) ||
          v.desc.toLowerCase().includes(qLower)
        )
      : catalog;

    document.getElementById('resultsHeader').innerHTML = q
      ? `Results for <strong>"${q.replace(/</g, '')}"</strong> · ${hits.length} video${hits.length !== 1 ? 's' : ''}`
      : `All videos · ${hits.length}`;

    const list = document.getElementById('resultsList');
    if (hits.length === 0) {
      list.innerHTML = `<div class="no-results">No results for "${q.replace(/</g, '')}". Try “office”, “michael”, or “election”.</div>`;
    } else {
      list.innerHTML = hits.map(v => `
        <a href="watch.html?v=${v.id}" class="result-item">
          <div class="result-thumb">
            <img src="${v.thumb}" alt="" />
            <div class="ai-badge">AI PARODY</div>
            <div class="duration">${v.duration}</div>
          </div>
          <div class="result-info">
            <div class="result-title">${v.title}</div>
            <div class="result-meta">${v.views} · ${v.age}</div>
            <div class="result-channel">
              <span class="av">${v.avatar}</span>
              <span>${v.channel}</span>
            </div>
            <div class="result-desc">${v.desc}</div>
          </div>
        </a>
      `).join('');
    }

    const menuBtn = document.getElementById('menuBtn');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');
    menuBtn.addEventListener('click', () => {
      sidebar.classList.toggle('open');
      overlay.classList.toggle('show');
    });
    overlay.addEventListener('click', () => {
      sidebar.classList.remove('open');
      overlay.classList.remove('show');
    });
  </script>
</body>
</html>
