<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Channel – SpoofStream</title>
  <style>
    :root {
      --bg: #0f0f0f;
      --bg-secondary: #212121;
      --bg-hover: #3f3f3f;
      --text: #f1f1f1;
      --text-secondary: #aaaaaa;
      --accent: #3ea6ff;
      --red: #ff4e45;
      --border: #303030;
      --sidebar-width: 240px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      min-height: 100vh;
    }
    a { color: inherit; text-decoration: none; }
    .sidebar {
      width: var(--sidebar-width);
      background: var(--bg);
      border-right: 1px solid var(--border);
      height: 100vh;
      position: fixed;
      left: 0; top: 0;
      padding: 12px;
      overflow-y: auto;
      z-index: 100;
      transition: transform 0.25s ease;
    }
    .logo {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 12px 20px;
      font-size: 20px; font-weight: 700; letter-spacing: -0.5px;
    }
    .logo span { color: var(--accent); }
    .nav-item {
      display: flex; align-items: center; gap: 20px;
      padding: 10px 12px; border-radius: 10px;
      font-size: 14px; font-weight: 500;
      transition: background 0.15s; margin-bottom: 2px; cursor: pointer;
    }
    .nav-item:hover, .nav-item.active { background: var(--bg-hover); }
    .nav-item svg { width: 22px; height: 22px; flex-shrink: 0; }
    .section-title {
      font-size: 13px; font-weight: 600; color: var(--text-secondary);
      padding: 16px 12px 8px; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .main { margin-left: var(--sidebar-width); flex: 1; min-height: 100vh; }
    .topbar {
      position: sticky; top: 0; background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 10px 24px;
      display: flex; align-items: center; justify-content: space-between; gap: 20px;
      z-index: 50;
    }
    .menu-btn {
      display: none; background: none; border: none; color: var(--text);
      cursor: pointer; padding: 8px; border-radius: 50%;
    }
    .menu-btn:hover { background: var(--bg-hover); }
    .search-container { flex: 1; max-width: 640px; display: flex; }
    .search-input {
      flex: 1; background: var(--bg); border: 1px solid var(--border);
      border-right: none; border-radius: 40px 0 0 40px;
      padding: 10px 18px; color: var(--text); font-size: 16px; outline: none;
    }
    .search-input:focus { border-color: var(--accent); }
    .search-btn {
      background: var(--bg-secondary); border: 1px solid var(--border);
      border-radius: 0 40px 40px 0; padding: 0 22px; cursor: pointer; color: var(--text);
    }
    .btn {
      padding: 8px 16px; border-radius: 20px; font-size: 14px; font-weight: 500;
      cursor: pointer; border: none; transition: background 0.15s;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .btn-outline {
      background: transparent; border: 1px solid var(--border); color: var(--accent);
    }
    .btn-outline:hover { background: rgba(62, 166, 255, 0.1); }
    .btn-primary { background: var(--accent); color: #000; }
    .btn-primary:hover { background: #65b8ff; }
    .btn-subscribed { background: var(--bg-hover); color: var(--text-secondary); }

    .banner {
      width: 100%;
      height: 180px;
      background: linear-gradient(135deg, #1a3a5c, #0f0f0f 60%);
      border-bottom: 1px solid var(--border);
    }
    .channel-header {
      padding: 0 24px;
      display: flex;
      align-items: flex-end;
      gap: 20px;
      margin-top: -40px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .channel-avatar-lg {
      width: 96px; height: 96px;
      border-radius: 50%;
      background: var(--bg-hover);
      border: 4px solid var(--bg);
      display: flex; align-items: center; justify-content: center;
      font-size: 36px; font-weight: 700; color: var(--accent);
      flex-shrink: 0;
    }
    .channel-details { flex: 1; min-width: 200px; padding-bottom: 8px; }
    .channel-details h1 { font-size: 24px; font-weight: 700; margin-bottom: 4px; }
    .channel-details p { font-size: 14px; color: var(--text-secondary); }
    .channel-actions { padding-bottom: 8px; }

    .tabs {
      display: flex; gap: 8px;
      padding: 0 24px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
    }
    .tab {
      padding: 12px 16px;
      font-size: 14px; font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
    }
    .tab.active {
      color: var(--text);
      border-bottom-color: var(--text);
    }

    .content { padding: 0 24px 40px; }
    .video-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px 16px;
    }
    .video-card {
      display: block;
      cursor: pointer;
      transition: transform 0.15s;
    }
    .video-card:hover { transform: translateY(-2px); }
    .thumbnail {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      background: var(--bg-secondary);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 10px;
    }
    .thumbnail img { width: 100%; height: 100%; object-fit: cover; }
    .duration {
      position: absolute; bottom: 8px; right: 8px;
      background: rgba(0,0,0,0.85); color: white;
      font-size: 12px; font-weight: 500; padding: 2px 6px; border-radius: 4px;
    }
    .ai-badge {
      position: absolute; top: 8px; left: 8px;
      background: rgba(0,0,0,0.75); color: var(--accent);
      font-size: 11px; font-weight: 600; padding: 3px 7px; border-radius: 4px;
    }
    .video-meta h3 {
      font-size: 14px; font-weight: 500; line-height: 1.4; margin-bottom: 4px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .video-meta p { font-size: 13px; color: var(--text-secondary); }

    .about-box {
      display: none;
      background: var(--bg-secondary);
      border-radius: 12px;
      padding: 20px;
      max-width: 720px;
      font-size: 14px;
      line-height: 1.6;
      color: var(--text-secondary);
    }
    .about-box.active { display: block; }
    .about-box h3 { color: var(--text); margin-bottom: 8px; font-size: 16px; }

    .overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.5); z-index: 90;
    }
    .overlay.show { display: block; }

    @media (max-width: 1200px) {
      .video-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 768px) {
      .sidebar { transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
      .main { margin-left: 0; }
      .menu-btn { display: block; }
      .video-grid { grid-template-columns: 1fr; }
      .banner { height: 120px; }
      .channel-avatar-lg { width: 72px; height: 72px; font-size: 28px; }
    }
  </style>
</head>
<body>
  <div class="overlay" id="overlay"></div>

  <aside class="sidebar" id="sidebar">
    <a href="index.html" class="logo">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
        <path d="M4 6h16v12H4z" fill="#3ea6ff"/>
        <path d="M10 9l5 3-5 3V9z" fill="#0f0f0f"/>
      </svg>
      Spoof<span>Stream</span>
    </a>
    <a href="index.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      Home
    </a>
    <div class="nav-item">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.77 10.32l-1.2-.5L18 9.06c1.84-.96 2.53-3.23 1.56-5.06s-3.24-2.53-5.07-1.56L6 6.94c-1.29.68-2.26 1.99-2.6 3.44-.32 1.46.06 2.96 1.04 4.11l1.2.5-1.44.75c-1.84.96-2.53 3.23-1.56 5.06s3.24 2.53 5.07 1.56l8.5-4.42c1.29-.68 2.26-1.99 2.6-3.44.32-1.46-.06-2.96-1.04-4.11z"/></svg>
      Shorts
    </div>
    <div class="nav-item">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 18v-6l5 3-5 3zm7-15H7v2h10V3zm2 4H5v12h14V7zm-7 2v6l5-3-5-3z"/></svg>
      Subscriptions
    </div>
    <div class="section-title">Library</div>
    <a href="upload.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-1 9h-4v4h-2v-4H9V9h4V5h2v4h4v2z"/></svg>
      Your Uploads
    </a>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
      </button>
      <form class="search-container" action="search.html" method="get">
        <input type="text" name="q" class="search-input" placeholder="Search AI parodies..." />
        <button type="submit" class="search-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        </button>
      </form>
      <div class="top-actions">
        <a href="auth.html" class="btn btn-outline">Sign In</a>
      </div>
    </header>

    <div class="banner"></div>

    <div class="channel-header">
      <div class="channel-avatar-lg" id="chAvatar">T</div>
      <div class="channel-details">
        <h1 id="chName">TBC_on_X</h1>
        <p id="chStats">@tbc_on_x · 128K subscribers · 24 videos</p>
      </div>
      <div class="channel-actions">
        <button class="btn btn-primary" id="subscribeBtn">Subscribe</button>
      </div>
    </div>

    <div class="tabs">
      <div class="tab active" data-tab="videos">Videos</div>
      <div class="tab" data-tab="about">About</div>
    </div>

    <div class="content">
      <div class="video-grid" id="channelVideos"></div>
      <div class="about-box" id="aboutBox">
        <h3>About this channel</h3>
        <p id="aboutText">AI parodies and remakes. Not affiliated with any original studio or network. Entertainment only.</p>
      </div>
    </div>
  </div>

  <script>
    const channels = {
      tbc: {
        id: 'tbc', name: 'TBC_on_X', avatar: 'T', handle: '@tbc_on_x',
        subs: '128K subscribers', videos: '24 videos',
        about: 'Home of Dunder Mifflin AI chaos. Parodies only — not the real Office.',
        videoIds: ['office1']
      },
      aioffice: {
        id: 'aioffice', name: 'AI Office Labs', avatar: 'A', handle: '@aiofficelabs',
        subs: '89K subscribers', videos: '18 videos',
        about: 'Explaining tech through Michael Scott energy.',
        videoIds: ['office2']
      },
      spoofcentral: {
        id: 'spoofcentral', name: 'SpoofCentral', avatar: 'F', handle: '@spoofcentral',
        subs: '210K subscribers', videos: '41 videos',
        about: 'Sitcom remixes and political spoofs.',
        videoIds: ['friends1']
      },
      remake: {
        id: 'remake', name: 'RemakeFactory', avatar: 'B', handle: '@remakefactory',
        subs: '340K subscribers', videos: '56 videos',
        about: 'Breaking stories into AI startup arcs.',
        videoIds: ['breaking']
      },
      classic: {
        id: 'classic', name: 'ClassicSpoofs', avatar: 'S', handle: '@classicspoofs',
        subs: '95K subscribers', videos: '33 videos',
        about: 'Seinfeld, algorithms, and nothing.',
        videoIds: ['seinfeld']
      },
      schrute: {
        id: 'schrute', name: 'SchruteFarmsAI', avatar: 'D', handle: '@schrutefarmsai',
        subs: '156K subscribers', videos: '12 videos',
        about: 'Beets. Bunkers. Blue waves.',
        videoIds: ['office3']
      },
      leslie: {
        id: 'leslie', name: 'LeslieAI', avatar: 'P', handle: '@leslieai',
        subs: '72K subscribers', videos: '9 videos',
        about: 'Parks, rec, and shutdown specials.',
        videoIds: ['parks']
      },
      springfield: {
        id: 'springfield', name: 'SpringfieldSpoofs', avatar: 'H', handle: '@springfields',
        subs: '401K subscribers', videos: '67 videos',
        about: 'Predictions from Springfield.',
        videoIds: ['simpsons']
      },
      beesly: {
        id: 'beesly', name: 'BeeslyBots', avatar: 'J', handle: '@beeslybots',
        subs: '61K subscribers', videos: '15 videos',
        about: 'Jim’s camera looks, AI edition.',
        videoIds: ['office4']
      },
      you: {
        id: 'you', name: 'Your Channel', avatar: 'Y', handle: '@you',
        subs: '0 subscribers', videos: '0 videos',
        about: 'This is your channel after signing up. Upload to get started.',
        videoIds: []
      }
    };

    const videoMeta = {
      office1: { title: 'Dunder Mifflin Preps for the Blue Tsunami', views: '1.9M views', age: '2 hours ago', duration: '15:47', thumb: 'https://picsum.photos/seed/office1/640/360' },
      office2: { title: 'Michael Scott Explains Large Language Models', views: '482K views', age: '5 hours ago', duration: '8:22', thumb: 'https://picsum.photos/seed/office2/640/360' },
      friends1: { title: 'Friends but Everyone is Running for Office', views: '310K views', age: '1 day ago', duration: '12:05', thumb: 'https://picsum.photos/seed/friends1/640/360' },
      breaking: { title: 'Breaking Bad – The AI Startup Arc', views: '890K views', age: '2 days ago', duration: '22:18', thumb: 'https://picsum.photos/seed/breaking/640/360' },
      seinfeld: { title: 'Seinfeld: The Algorithm Episode', views: '215K views', age: '3 days ago', duration: '9:41', thumb: 'https://picsum.photos/seed/seinfeld/640/360' },
      office3: { title: 'Dwight’s Guide to Surviving the Blue Wave', views: '1.1M views', age: '4 days ago', duration: '18:03', thumb: 'https://picsum.photos/seed/office3/640/360' },
      parks: { title: 'Parks and Rec: The Government Shutdown Special', views: '167K views', age: '6 hours ago', duration: '11:27', thumb: 'https://picsum.photos/seed/parks/640/360' },
      simpsons: { title: 'The Simpsons Predict the Next Election', views: '542K views', age: '1 day ago', duration: '7:55', thumb: 'https://picsum.photos/seed/simpsons/640/360' },
      office4: { title: 'Jim’s Camera Looks – AI Election Edition', views: '298K views', age: '2 days ago', duration: '14:12', thumb: 'https://picsum.photos/seed/office4/640/360' }
    };

    const params = new URLSearchParams(window.location.search);
    const c = params.get('c') || 'tbc';
    const ch = channels[c] || channels.tbc;

    document.title = ch.name + ' – SpoofStream';
    document.getElementById('chAvatar').textContent = ch.avatar;
    document.getElementById('chName').textContent = ch.name;
    document.getElementById('chStats').textContent = `${ch.handle} · ${ch.subs} · ${ch.videos}`;
    document.getElementById('aboutText').textContent = ch.about;

    const grid = document.getElementById('channelVideos');
    if (ch.videoIds.length === 0) {
      grid.innerHTML = '<p style="color:var(--text-secondary);grid-column:1/-1;">No videos yet. <a href="upload.html" style="color:var(--accent);">Upload one</a></p>';
    } else {
      grid.innerHTML = ch.videoIds.map(id => {
        const v = videoMeta[id];
        return `
          <a href="watch.html?v=${id}" class="video-card">
            <div class="thumbnail">
              <img src="${v.thumb}" alt="" />
              <div class="ai-badge">AI PARODY</div>
              <div class="duration">${v.duration}</div>
            </div>
            <div class="video-meta">
              <h3>${v.title}</h3>
              <p>${v.views} · ${v.age}</p>
            </div>
          </a>`;
      }).join('');
    }

    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        const isAbout = tab.dataset.tab === 'about';
        grid.style.display = isAbout ? 'none' : 'grid';
        document.getElementById('aboutBox').classList.toggle('active', isAbout);
      });
    });

    let subscribed = false;
    document.getElementById('subscribeBtn').addEventListener('click', function () {
      subscribed = !subscribed;
      this.textContent = subscribed ? 'Subscribed' : 'Subscribe';
      this.classList.toggle('btn-primary', !subscribed);
      this.classList.toggle('btn-subscribed', subscribed);
    });

    const menuBtn = document.getElementById('menuBtn');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');
    menuBtn.addEventListener('click', () => {
      sidebar.classList.toggle('open');
      overlay.classList.toggle('show');
    });
    overlay.addEventListener('click', () => {
      sidebar.classList.remove('open');
      overlay.classList.remove('show');
    });
  </script>
</body>
</html>
