<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shorts – SpoofStream</title>
  <style>
    :root {
      --bg: #0f0f0f;
      --bg-secondary: #212121;
      --bg-hover: #3f3f3f;
      --text: #f1f1f1;
      --text-secondary: #aaaaaa;
      --accent: #3ea6ff;
      --red: #ff4e45;
      --border: #303030;
      --sidebar-width: 240px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      min-height: 100vh;
      overflow-x: hidden;
    }
    a { color: inherit; text-decoration: none; }

    .sidebar {
      width: var(--sidebar-width);
      background: var(--bg);
      border-right: 1px solid var(--border);
      height: 100vh;
      position: fixed;
      left: 0; top: 0;
      padding: 12px;
      overflow-y: auto;
      z-index: 100;
      transition: transform 0.25s ease;
    }
    .logo {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 12px 20px;
      font-size: 20px; font-weight: 700; letter-spacing: -0.5px;
    }
    .logo span { color: var(--accent); }
    .nav-item {
      display: flex; align-items: center; gap: 20px;
      padding: 10px 12px; border-radius: 10px;
      font-size: 14px; font-weight: 500;
      transition: background 0.15s; margin-bottom: 2px; cursor: pointer;
    }
    .nav-item:hover, .nav-item.active { background: var(--bg-hover); }
    .nav-item svg { width: 22px; height: 22px; flex-shrink: 0; }
    .section-title {
      font-size: 13px; font-weight: 600; color: var(--text-secondary);
      padding: 16px 12px 8px; text-transform: uppercase; letter-spacing: 0.5px;
    }

    .main {
      margin-left: var(--sidebar-width);
      flex: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .topbar {
      position: sticky; top: 0; background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 10px 24px;
      display: flex; align-items: center; justify-content: space-between; gap: 20px;
      z-index: 50;
    }
    .menu-btn {
      display: none; background: none; border: none; color: var(--text);
      cursor: pointer; padding: 8px; border-radius: 50%;
    }
    .menu-btn:hover { background: var(--bg-hover); }
    .search-container { flex: 1; max-width: 640px; display: flex; }
    .search-input {
      flex: 1; background: var(--bg); border: 1px solid var(--border);
      border-right: none; border-radius: 40px 0 0 40px;
      padding: 10px 18px; color: var(--text); font-size: 16px; outline: none;
    }
    .search-input:focus { border-color: var(--accent); }
    .search-btn {
      background: var(--bg-secondary); border: 1px solid var(--border);
      border-radius: 0 40px 40px 0; padding: 0 22px; cursor: pointer; color: var(--text);
    }
    .search-btn:hover { background: var(--bg-hover); }
    .btn {
      padding: 8px 16px; border-radius: 20px; font-size: 14px; font-weight: 500;
      cursor: pointer; border: none; display: inline-flex; align-items: center;
    }
    .btn-outline {
      background: transparent; border: 1px solid var(--border); color: var(--accent);
    }
    .btn-outline:hover { background: rgba(62, 166, 255, 0.1); }

    /* Shorts feed */
    .shorts-wrap {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: stretch;
      padding: 16px;
      min-height: 0;
    }
    .shorts-feed {
      width: 100%;
      max-width: 420px;
      height: calc(100vh - 80px);
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      border-radius: 16px;
      scrollbar-width: none;
    }
    .shorts-feed::-webkit-scrollbar { display: none; }

    .short-card {
      position: relative;
      width: 100%;
      height: calc(100vh - 80px);
      max-height: 780px;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 12px;
      flex-shrink: 0;
    }
    .short-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .short-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(transparent 40%, rgba(0,0,0,0.75) 100%);
      pointer-events: none;
    }
    .short-play {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      background: rgba(0,0,0,0.2);
    }
    .short-play.hidden { display: none; }
    .short-play-btn {
      width: 64px; height: 64px; border-radius: 50%;
      background: rgba(0,0,0,0.55); border: 2px solid #fff;
      display: flex; align-items: center; justify-content: center; color: #fff;
    }
    .ai-badge {
      position: absolute;
      top: 12px; left: 12px;
      background: rgba(0,0,0,0.75); color: var(--accent);
      font-size: 11px; font-weight: 600; padding: 4px 8px; border-radius: 4px;
      z-index: 2;
    }
    .short-side {
      position: absolute;
      right: 12px;
      bottom: 100px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      z-index: 3;
    }
    .side-btn {
      background: none; border: none; color: #fff;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      cursor: pointer; font-size: 12px; font-weight: 500;
    }
    .side-btn svg {
      width: 28px; height: 28px;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,0.6));
    }
    .side-btn.active { color: var(--accent); }
    .short-meta {
      position: absolute;
      left: 14px; right: 70px; bottom: 20px;
      z-index: 3;
    }
    .short-channel {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 10px;
    }
    .short-avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--bg-hover);
      display: flex; align-items: center; justify-content: center;
      font-weight: 600; font-size: 14px; color: var(--accent);
      border: 2px solid #fff;
    }
    .short-channel a {
      font-size: 14px; font-weight: 600;
      text-shadow: 0 1px 2px rgba(0,0,0,0.8);
    }
    .sub-chip {
      background: var(--accent); color: #000;
      font-size: 12px; font-weight: 600;
      padding: 4px 10px; border-radius: 14px;
      border: none; cursor: pointer;
    }
    .short-title {
      font-size: 14px; font-weight: 500; line-height: 1.4;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
      display: -webkit-box; -webkit-line-clamp: 2;
      -webkit-box-orient: vertical; overflow: hidden;
    }
    .short-hint {
      text-align: center;
      font-size: 12px;
      color: var(--text-secondary);
      padding: 8px;
    }

    .overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.5); z-index: 90;
    }
    .overlay.show { display: block; }

    @media (max-width: 768px) {
      .sidebar { transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
      .main { margin-left: 0; }
      .menu-btn { display: block; }
      .shorts-feed, .short-card {
        height: calc(100vh - 70px);
        max-height: none;
        border-radius: 0;
      }
      .shorts-wrap { padding: 0; }
    }
  </style>
</head>
<body>
  <div class="overlay" id="overlay"></div>

  <aside class="sidebar" id="sidebar">
    <a href="index.html" class="logo">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
        <path d="M4 6h16v12H4z" fill="#3ea6ff"/>
        <path d="M10 9l5 3-5 3V9z" fill="#0f0f0f"/>
      </svg>
      Spoof<span>Stream</span>
    </a>
    <a href="index.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      Home
    </a>
    <a href="shorts.html" class="nav-item active">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.77 10.32l-1.2-.5L18 9.06c1.84-.96 2.53-3.23 1.56-5.06s-3.24-2.53-5.07-1.56L6 6.94c-1.29.68-2.26 1.99-2.6 3.44-.32 1.46.06 2.96 1.04 4.11l1.2.5-1.44.75c-1.84.96-2.53 3.23-1.56 5.06s3.24 2.53 5.07 1.56l8.5-4.42c1.29-.68 2.26-1.99 2.6-3.44.32-1.46-.06-2.96-1.04-4.11z"/></svg>
      Shorts
    </a>
    <div class="nav-item">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 18v-6l5 3-5 3zm7-15H7v2h10V3zm2 4H5v12h14V7zm-7 2v6l5-3-5-3z"/></svg>
      Subscriptions
    </div>
    <div class="section-title">Explore</div>
    <a href="search.html?q=" class="nav-item">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
      Categories
    </a>
    <a href="search.html?q=trending" class="nav-item">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
      Trending
    </a>
    <div class="section-title">Library</div>
    <a href="upload.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-1 9h-4v4h-2v-4H9V9h4V5h2v4h4v2z"/></svg>
      Your Uploads
    </a>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
      </button>
      <form class="search-container" action="search.html" method="get">
        <input type="text" name="q" class="search-input" placeholder="Search AI parodies..." />
        <button type="submit" class="search-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        </button>
      </form>
      <div class="top-actions">
        <a href="auth.html" class="btn btn-outline">Sign In</a>
      </div>
    </header>

    <div class="shorts-wrap">
      <div>
        <div class="shorts-feed" id="shortsFeed"></div>
        <p class="short-hint">Scroll for next · click to play/pause (demo)</p>
      </div>
    </div>
  </div>

  <script>
    const shorts = [
      {
        id: 's1',
        title: 'Michael’s 15-second TED Talk on AI',
        channel: 'AI Office Labs',
        channelId: 'aioffice',
        avatar: 'A',
        likes: '24K',
        comments: '312',
        thumb: 'https://picsum.photos/seed/short1/540/960'
      },
      {
        id: 's2',
        title: 'Dwight’s beet bunker tip #1',
        channel: 'SchruteFarmsAI',
        channelId: 'schrute',
        avatar: 'D',
        likes: '18K',
        comments: '201',
        thumb: 'https://picsum.photos/seed/short2/540/960'
      },
      {
        id: 's3',
        title: 'Jim camera look: election edition',
        channel: 'BeeslyBots',
        channelId: 'beesly',
        avatar: 'J',
        likes: '41K',
        comments: '890',
        thumb: 'https://picsum.photos/seed/short3/540/960'
      },
      {
        id: 's4',
        title: 'Friends open on the debate stage',
        channel: 'SpoofCentral',
        channelId: 'spoofcentral',
        avatar: 'F',
        likes: '33K',
        comments: '456',
        thumb: 'https://picsum.photos/seed/short4/540/960'
      },
      {
        id: 's5',
        title: 'Walter White pitches the model',
        channel: 'RemakeFactory',
        channelId: 'remake',
        avatar: 'B',
        likes: '52K',
        comments: '1.2K',
        thumb: 'https://picsum.photos/seed/short5/540/960'
      },
      {
        id: 's6',
        title: 'Springfield predicts in 20 seconds',
        channel: 'SpringfieldSpoofs',
        channelId: 'springfield',
        avatar: 'H',
        likes: '67K',
        comments: '2.1K',
        thumb: 'https://picsum.photos/seed/short6/540/960'
      }
    ];

    const feed = document.getElementById('shortsFeed');
    feed.innerHTML = shorts.map((s, i) => `
      <div class="short-card" data-id="${s.id}">
        <div class="ai-badge">AI SHORT</div>
        <img src="${s.thumb}" alt="" />
        <div class="short-overlay"></div>
        <div class="short-play" data-play>
          <div class="short-play-btn">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          </div>
        </div>
        <div class="short-side">
          <button class="side-btn" data-like>
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/></svg>
            <span>${s.likes}</span>
          </button>
          <button class="side-btn">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.99 4c0-1.1-.89-2-1.99-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14l4 4-.01-18z"/></svg>
            <span>${s.comments}</span>
          </button>
          <button class="side-btn">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg>
            <span>Share</span>
          </button>
        </div>
        <div class="short-meta">
          <div class="short-channel">
            <div class="short-avatar">${s.avatar}</div>
            <a href="channel.html?c=${s.channelId}">${s.channel}</a>
            <button class="sub-chip" data-sub>Subscribe</button>
          </div>
          <div class="short-title">${s.title}</div>
        </div>
      </div>
    `).join('');

    feed.querySelectorAll('[data-play]').forEach(el => {
      el.addEventListener('click', () => el.classList.toggle('hidden'));
    });
    feed.querySelectorAll('[data-like]').forEach(el => {
      el.addEventListener('click', () => el.classList.toggle('active'));
    });
    feed.querySelectorAll('[data-sub]').forEach(el => {
      el.addEventListener('click', (e) => {
        e.preventDefault();
        const on = el.textContent === 'Subscribe';
        el.textContent = on ? 'Subscribed' : 'Subscribe';
        el.style.background = on ? 'var(--bg-hover)' : 'var(--accent)';
        el.style.color = on ? 'var(--text-secondary)' : '#000';
      });
    });

    const menuBtn = document.getElementById('menuBtn');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');
    menuBtn.addEventListener('click', () => {
      sidebar.classList.toggle('open');
      overlay.classList.toggle('show');
    });
    overlay.addEventListener('click', () => {
      sidebar.classList.remove('open');
      overlay.classList.remove('show');
    });
  </script>
</body>
</html>
